<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090B09"><style>*{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style></head><body><title>Organizador OPTCG</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: columna móvil de 560px para el organizador; pantalla pública a todo el ancho. Estética Torneos, solo oscuro. */
:root{
  color-scheme:dark;
  --bg:#090B09; --card:#141715; --card2:#1B1F1C; --line:#262B27; --line2:#3A403B;
  --fg:#ECE7DA; --mute:#8F938A; --dim:#5E625C;
  /* Paleta de tres colores: negro, blanco y rojo (los grises son tonos del negro y el blanco) */
  --win:#E5484D; --win-bg:rgba(229,72,77,.15);
  --loss:var(--mute); --ok:var(--win); --warn:var(--win); --warn-bg:var(--win-bg);
  --f-d:'Oswald','Arial Narrow',Impact,sans-serif;
  --f-b:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-b);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--win);outline-offset:2px}
h1,h2,h3{font-family:var(--f-d);text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin:0;text-wrap:balance}
h2{font-size:18px} h3{font-size:14px;color:var(--mute);letter-spacing:.08em}
.wrap{max-width:560px;margin:0 auto;padding-block:0 64px}
.wrap.wide{max-width:none;padding-block:0}
body.screen-mode{overflow:hidden}
.wrap.wide .scr{min-height:100vh;min-height:100dvh}

/* Cabecera */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mark{font-family:var(--f-d);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.mark b{color:var(--fg);font-weight:600}
.tsel{display:flex;gap:8px;align-items:center;margin-top:8px}
.tsel select{flex:1;font-family:var(--f-d);font-size:20px;text-transform:uppercase;letter-spacing:.03em;background:transparent;border:0;color:var(--fg);padding:2px 0;min-width:0}
.tsel select option{background:var(--card);font-family:var(--f-b);font-size:15px;text-transform:none}
nav.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-top:8px;scrollbar-width:none}
.tab{flex:none;background:none;border:0;border-bottom:2px solid transparent;font-family:var(--f-d);text-transform:uppercase;letter-spacing:.07em;font-size:13px;color:var(--mute);padding:10px 9px}
.tab.on{color:var(--fg);border-bottom-color:var(--fg)}

/* Bloques */
.sec{display:grid;gap:12px;margin-top:20px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px}
.muted{color:var(--mute)} .small{font-size:13px}
.chip{font-family:var(--f-d);font-size:11px;letter-spacing:.09em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--mute);white-space:nowrap}
.chip.live{color:var(--ok);border-color:var(--ok)} .chip.top{color:var(--win);border-color:var(--win)} .chip.warn{color:var(--warn);border-color:var(--warn)}
.btn{font-family:var(--f-d);text-transform:uppercase;letter-spacing:.06em;font-size:14px;background:var(--fg);color:var(--bg);border:1px solid var(--fg);border-radius:6px;padding:10px 14px}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line2)}
.btn.danger{background:transparent;color:var(--fg);border-color:var(--fg);text-decoration:underline;text-underline-offset:3px}
/* Fotos de jugador y cartas de líder */
.pc{display:flex;align-items:center;gap:9px;min-width:0}
.pt{min-width:0;flex:1}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;background:var(--card2);border:1px solid var(--line2)}
/* Enfrentamiento */
.fo{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;--cw:132px}
.fo-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-family:var(--f-d);text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--mute)}
.fo-t b{font-size:1.7em;font-weight:600;color:var(--fg);margin-left:.35em;vertical-align:-.12em;font-variant-numeric:tabular-nums}
.fo-s{text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fo-s.w{color:var(--win);font-weight:600}
.fo-b{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;padding:14px 12px 12px;align-items:start}
.fo-vs{align-self:center;font-family:var(--f-d);font-weight:700;font-size:1.3em;letter-spacing:.06em;color:var(--dim);margin-top:-1.6em}
.fo-p{display:grid;justify-items:center;gap:10px;text-align:center;min-width:0}
.fo-card{position:relative;display:block;width:min(100%,var(--cw));aspect-ratio:5/7;height:auto;max-width:100%;padding:0;border:2px solid var(--line2);border-radius:9px;background:var(--card2);transition:transform .15s,border-color .15s,box-shadow .15s}
.fo-btn{display:block;background:none;border:0;padding:0;width:min(100%,var(--cw));border-radius:9px}
.fo-btn .fo-card{width:100%}
.fo-btn:hover .fo-card{border-color:var(--fg)}
.fo-btn:active .fo-card{transform:scale(.97)}
.cdL{display:block;width:100%;height:100%;object-fit:cover;border-radius:7px}
.cdL.ph{display:grid;place-items:center;padding:10px;font-family:var(--f-d);text-transform:uppercase;letter-spacing:.04em;font-size:.95em;line-height:1.15;color:var(--mute);overflow-wrap:anywhere}
.fo-av{position:absolute;right:-10px;bottom:-10px;width:42%;height:auto;aspect-ratio:1;border:3px solid var(--card);font-size:.85em}
.fo-badge{display:none;position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--win);color:var(--bg);font-family:var(--f-d);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:12px;padding:3px 12px;border-radius:99px;white-space:nowrap}
.fo-card.w{border-color:var(--win);box-shadow:0 0 0 4px var(--win-bg),0 10px 28px rgba(0,0,0,.5);transform:scale(1.04)}
.fo-card.w .fo-badge{display:block}
.fo-p.w .nm{color:var(--win)}
.fo-card.l .cdL,.fo-card.l .fo-av{filter:grayscale(1) brightness(.4)}
.fo-card.l{border-color:var(--line)}
.fo-p.l .fo-n{opacity:.45}
.fo-n{display:grid;gap:1px;min-width:0;max-width:100%}
.fo-n .nm,.fo-n .ld{overflow-wrap:anywhere}
.fo .gb{justify-content:center}
.fo .xt{border-top:1px solid var(--line)}
.fo.done{border-color:var(--line2)}
.scr .tiles{grid-template-columns:repeat(auto-fill,minmax(min(100%,clamp(300px,24vw,420px)),1fr));gap:16px}
.scr .fo{--cw:clamp(110px,9vw,180px);font-size:clamp(14px,1.15vw,20px)}
.scr .fo-badge{font-size:.75em}
/* Misma pieza en pequeño: clasificación, inscritos y podio */
.fo-card.sm{--cw:40px;width:var(--cw);flex:none;border-width:1px;border-radius:5px}
.fo-card.sm .cdL{border-radius:4px}
.fo-card.sm .cdL.ph{font-size:7px;padding:3px}
.fo-card.sm .fo-av{border-width:2px;right:-6px;bottom:-6px;font-size:7px}
.fo-card.sm .fo-badge{display:none}
.fo-card.sm.w{transform:none;box-shadow:0 0 0 3px var(--win-bg)}
.pc{gap:14px}
.pod .fo-card.sm{--cw:54px}
.scr td .fo-card.sm{--cw:clamp(40px,3.2vw,60px)}
.scr .pod .fo-card.sm{--cw:clamp(54px,4.4vw,80px)}
tr.drop .fo-card .cdL,tr.drop .fo-av{filter:grayscale(1) brightness(.4)}
td{vertical-align:middle;padding-block:11px}
/* Cuadro: enfrentamientos compactos */
.fo.compact{--cw:86px;font-size:12px;width:100%}
.fo.compact .fo-h{padding:5px 10px;font-size:11px}
.fo.compact .fo-b{padding:12px 8px 8px;gap:4px}
.fo.compact .fo-vs{font-size:1.1em}
.fo.compact .fo-av{border-width:2px}
.fo.compact .fo-badge{font-size:10px;padding:2px 8px;top:-9px}
.fo.compact .nm{font-size:12.5px}
.fo.compact .ld{font-size:11px}
.fo.xs{--cw:50px;font-size:11px}
.fo.xs .ld{display:none}
.fo.xs .nm{font-size:11.5px}
.fo.xs .fo-badge{display:none!important}
.fo.xs .fo-card.w{transform:none;box-shadow:0 0 0 3px var(--win-bg)}
.fo.xs .cdL.ph{font-size:8px;padding:4px}
.fo.live{border-color:var(--fg)}
.cdL.ph.back{font-size:2.4em;font-weight:700;color:var(--win);background:repeating-linear-gradient(45deg,var(--card2) 0 8px,var(--card) 8px 16px);border-radius:7px}
.fo-card.spin{border-color:var(--win);animation:jiggle .2s linear infinite}
@keyframes jiggle{50%{transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.fo-card.spin{animation:none}}
.deck-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.deck-tog{width:100%;font:inherit;color:inherit;display:grid;justify-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 6px;font-size:12px;text-align:center;opacity:.45}
.deck-tog.on{opacity:1;border-color:var(--line2)}
.deck-tog .fo-card{--cw:72px;width:var(--cw)}
.deck-tog .fo-card.sm{--cw:56px}
.deck-tog span:last-child{overflow-wrap:anywhere}
.deck-ed{grid-column:1/-1;justify-items:start}
.deck-ed .fo-card{--cw:110px;width:var(--cw)}
.sorteo{border-color:var(--win)}
[role="button"]{cursor:pointer}
/* Liga en línea */
.on-share{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.on-qr{width:150px;height:150px;image-rendering:pixelated;background:#fff;border-radius:8px;padding:4px}
.on-info{display:grid;gap:6px}
.on-code{font-family:var(--f-d);font-size:30px;letter-spacing:.08em}
.on-claims{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.on-cl{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:13px}
.on-cl .btn{margin-left:auto}
.on-dot{width:8px;height:8px;border-radius:50%;background:var(--line2);flex:none}
.on-cl.ok .on-dot,.ph-on{background:var(--win)}
.ph-on{display:inline-block;width:7px;height:7px;border-radius:50%;vertical-align:middle;margin-left:4px;box-shadow:0 0 0 3px var(--win-bg)}
.scr-hr{display:flex;align-items:flex-end;gap:24px}
.scr-join{display:flex;align-items:center;gap:12px;padding:6px 12px 6px 6px;border:1px solid var(--line2);border-radius:10px}
.scr-join img{width:clamp(70px,6.5vw,120px);height:auto;background:#fff;border-radius:6px;padding:3px;image-rendering:pixelated}
.scr-join div{display:grid}
.scr-join span{font-family:var(--f-d);text-transform:uppercase;letter-spacing:.1em;font-size:clamp(11px,.9vw,15px);color:var(--mute)}
.scr-join b{font-family:var(--f-d);font-size:clamp(22px,2.2vw,38px);letter-spacing:.08em}
/* Vista Jugador */
.wrap.plv{max-width:520px;padding-block:0 40px}
.pl-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:14px 10px;border-bottom:1px solid var(--line)}
.pl-box{display:grid;gap:12px;margin-top:22px;padding:18px;border:1px solid var(--line2);border-radius:12px;background:var(--card)}
.pl-names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pl-name{display:grid;gap:2px;padding:16px 10px;border:1px solid var(--line2);border-radius:10px;background:var(--card2);font-family:var(--f-d);text-transform:uppercase;letter-spacing:.04em;font-size:17px}
.pl-name small{font-family:var(--f-b);text-transform:none;letter-spacing:0;font-size:11px;color:var(--mute)}
.pl-name:disabled{opacity:.4}
.pl-who{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;font-size:14px}
.pl-turn{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;padding:16px;border:1px solid var(--line2);border-radius:12px;background:var(--card)}
.pl-turn>div:first-child{display:grid;gap:2px;min-width:0}
.pl-k{font-family:var(--f-d);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.pl-turn b{font-family:var(--f-d);font-size:24px;text-transform:uppercase;line-height:1.05}
.pl-turn.mine{border-color:var(--win);background:var(--win-bg)}
.pl-turn.mine .pl-k{color:var(--win)}
.pl-turn.mine b{font-size:34px}
.pl-clock{flex:none;width:72px;height:72px;border-radius:50%;border:3px solid var(--line2);display:grid;place-content:center;text-align:center;line-height:1}
.pl-clock b{font-size:30px;font-variant-numeric:tabular-nums}
.pl-clock small{font-family:var(--f-d);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.pl-turn.mine .pl-clock{border-color:var(--win)}
.pl-clock[data-mode="hurry"]{background:var(--win-bg);border-color:var(--win)}
.pl-clock[data-mode="hurry"] b{color:var(--win)}
.pl-clock[data-mode="wait"] b{color:var(--mute)}
.pl-vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:16px}
.pl-side{display:grid;justify-items:center;gap:6px;text-align:center;font-size:14px}
.pl-vs i{font-style:normal;font-family:var(--f-d);font-weight:700;color:var(--win);font-size:22px}
.fo-card.pl-mc{--cw:110px;width:var(--cw)}
.pl-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:18px;margin-bottom:8px}
.pl-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pl-dk{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border:1px solid var(--line);border-radius:10px;text-align:center;min-width:0}
.pl-dk .fo-card{--cw:78px;width:var(--cw)}
.pl-dk .cdL.ph{font-size:10px;padding:4px}
.pl-dk.free{border-color:var(--fg);background:var(--card)}
.pl-dk.free:active{transform:scale(.97)}
.pl-dk.used,.pl-dk.idle{opacity:.4}
.pl-dk.taken .fo-card .cdL{filter:grayscale(1) brightness(.45)}
.pl-dk.bann .dk-tag,.pl-dk.taken .dk-tag{color:var(--win)}
.pl-sent{text-align:center;color:var(--win);font-family:var(--f-d);letter-spacing:.08em;text-transform:uppercase;margin:12px 0 0}
.pl-tb tr.me td{background:var(--win-bg)}
.pl-tb td:nth-child(2),.pl-tb th:nth-child(2){text-align:left}
/* Gestión frente a pantalla pública */
.wrap.wide-ok{max-width:560px}
@media (min-width:1180px){
  .wrap.wide-ok{max-width:1560px}
  .gest{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:32px;align-items:start}
  .gest-side{display:block!important;position:sticky;top:calc(env(safe-area-inset-top,0px) + 110px);margin-top:20px}
  .pant{max-width:1100px;margin-inline:auto}
}
.gest-side{display:none}
.gest-head .chip{margin-bottom:6px;display:inline-block}
.tab.pub{display:flex;align-items:center;justify-content:center;gap:7px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--win);box-shadow:0 0 0 3px var(--win-bg);flex:none}
@media (prefers-reduced-motion:no-preference){.live-dot{animation:blink 1.6s steps(2,start) infinite}}
.pv-wrap{display:grid;gap:10px}
.pv-label{display:flex;align-items:center;gap:10px;font-family:var(--f-d);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.pv-label .muted{margin-left:auto;letter-spacing:.06em}
.pv-frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:10px;border:2px solid var(--win);box-shadow:0 0 0 5px var(--win-bg);background:var(--bg)}
.pv{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;pointer-events:none}
.pv .scr{min-height:0;height:900px;overflow:hidden;padding-block:24px}
.pv .scr-foot{display:none!important}
/* Clasificación y calendario */
.cpt-fit{--rh:56px;display:grid;gap:28px}
.cpt-fit.two{grid-template-columns:1fr 1fr}
.cpt-big{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.cpt-big th{height:calc(var(--rh)*.7);font-size:calc(var(--rh)*.24);padding:0 calc(var(--rh)*.2);background:none;border-bottom:2px solid var(--line2)}
.cpt-big td{height:var(--rh);padding:0 calc(var(--rh)*.2);font-size:calc(var(--rh)*.36);border-bottom:1px solid var(--line)}
.cpt-big td.pos{font-size:calc(var(--rh)*.46);width:calc(var(--rh)*1.1)}
.cpt-big td.pts{font-size:calc(var(--rh)*.5);font-weight:700}
.cpt-big .pc{gap:calc(var(--rh)*.28)}
.scr .cpt-big td .fo-card.sm,.cpt-big .fo-card.sm{--cw:calc(var(--rh)*.58)}
.cpt-big .fo-card.sm .fo-av{width:46%;border-width:2px}
.cpt-big .nm{font-size:calc(var(--rh)*.4);line-height:1.1}
.cpt-big .ld{font-size:calc(var(--rh)*.24)}
.cpt-big tr.top1 td{background:var(--win-bg)}
.cpt-big tr.top1 td.pos,.cpt-big tr.top1 td.pts{color:var(--win)}
.cpt-big tr.top2 td.pos,.cpt-big tr.top3 td.pos{color:var(--fg)}
.cpt-big td:nth-child(n+3),.cpt-big th:nth-child(n+3){width:calc(var(--rh)*1.3)}
/* clasificación en el móvil del organizador: sin desplazamiento lateral */
.cpt{table-layout:auto}
@media (max-width:520px){.cpt th,.cpt td{padding-inline:5px}.cpt .fo-card.sm{--cw:32px}.cpt .pc{gap:10px}.cpt .ld{display:none}.cpt td:nth-child(3),.cpt th:nth-child(3){display:none}}
.cpt td,.cpt th{text-align:center} .cpt td:nth-child(2),.cpt th:nth-child(2){text-align:left}
.cpt tr.lead td{background:var(--win-bg)}
.cal{display:grid;gap:10px}
.cal-j{gap:8px}
.cal-j.prev{opacity:.6;border-style:dashed}
.cal-m{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:baseline;font-size:14px;padding:4px 0;border-top:1px solid var(--line)}
.cal-m span:last-child{text-align:right}
.cal-m i{display:block;font-style:normal;font-size:11px;color:var(--mute)}
.cal-m b{font-family:var(--f-d);font-weight:500;color:var(--mute);font-variant-numeric:tabular-nums}
.cal-m .w{font-weight:600;color:var(--fg);box-shadow:inset 3px 0 0 var(--win);padding-left:8px}
.cal-m span:last-child.w{box-shadow:inset -3px 0 0 var(--win);padding:0 8px 0 0}
.cal-m .l{color:var(--mute)}
.cal-bans{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cal-bans .fo-card.sm{--cw:26px}
.rv-side,.rv-solo,.rv-vs,.st-band,.st-title,.st-n{will-change:transform,opacity}
.rv-card img,.fo-card img{image-rendering:auto}
/* cuenta atrás */
.st-in{transition:transform .5s cubic-bezier(.2,.9,.3,1)}
#stage.counting .st-in{transform:translateY(-26vh) scale(.62)}
#stage.counting .st-band{transition:transform .5s cubic-bezier(.2,.9,.3,1),opacity .5s;opacity:.35}
.st-count{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:2}

.dk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}

.draft.big{font-size:clamp(14px,1.2vw,20px);padding:clamp(14px,1.6vw,28px);gap:clamp(14px,1.6vw,26px)}

.draft.big .av.dr-av{width:clamp(64px,6vw,110px);height:clamp(64px,6vw,110px)}
.draft.big .dr-clock{width:clamp(90px,9vw,160px);height:clamp(90px,9vw,160px);border-width:4px}

.draft.big .av.dk-av{width:clamp(44px,3.6vw,64px);height:clamp(44px,3.6vw,64px)}
.fo-p.tbd .cdL.ph{border:0;font-size:.8em;color:var(--dim)}
.fo-g{display:inline-block;margin-left:6px;font-family:var(--f-d);color:var(--win)}
.pend{border:1px dashed var(--line2);border-radius:10px;padding:16px;text-align:center;font-family:var(--f-d);text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--dim)}
.ph-list{width:200px;gap:10px}
.bracket{--bkw:250px}
.scr .bracket{--bkw:clamp(250px,21vw,400px)}
.scr .fo.compact{--cw:clamp(86px,7.5vw,150px);font-size:clamp(12px,1vw,17px)}
.scr .fo.compact .nm{font-size:1.05em} .scr .fo.compact .ld{font-size:.85em}
/* Pantalla: reloj y progreso en una fila, mesas ajustadas al alto */
.scr-top{display:flex;gap:28px 56px;align-items:flex-end;flex-wrap:wrap}

.scr-start{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(9,11,9,.92);padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}

.scr-start .btn{font-size:20px;padding:16px 28px}

.scr-foot:hover,.scr-foot:focus-within{opacity:1}
.av.ini{display:grid;place-items:center;font-family:var(--f-d);font-size:13px;letter-spacing:.04em;color:var(--mute)}
.cd{width:26px;height:auto;aspect-ratio:5/7;border-radius:3px;object-fit:cover;flex:none;border:1px solid var(--line2)}

.media-edit{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}

.cd.ph{display:grid;place-items:center;background:var(--card2);color:var(--dim);font-family:var(--f-d);font-size:11px;letter-spacing:.08em;border-style:dashed}
.filebtn{position:relative;overflow:hidden}

.seg{display:flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

details>summary{cursor:pointer;list-style:none;font-family:var(--f-d);text-transform:uppercase;letter-spacing:.06em;font-size:14px}

.example{font-size:12px;color:var(--warn);border:1px dashed var(--warn);border-radius:8px;padding:8px 10px}

/* Reloj */
.timer{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px}
.tm-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tm-digits{font-family:var(--f-d);font-weight:500;font-size:68px;line-height:1;font-variant-numeric:tabular-nums;display:flex;white-space:nowrap}

.timer.warn .tm-digits{color:var(--warn)}
.timer.over .tm-digits{color:var(--win)}

/* Mesas */
.rounds{display:flex;gap:6px;overflow-x:auto}

.bk-r.w .sc{background:var(--win);color:var(--bg)}

.champ{width:calc(var(--bkw)*.8);border:2px solid var(--win);background:var(--win-bg);border-radius:12px;padding:22px 14px 14px;text-align:center;display:grid;justify-items:center;gap:6px}

.mini{position:relative;width:100%;background:var(--card);border:1px solid var(--line);border-radius:6px;font-size:13px}

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
(function(){
'use strict';
const KEY='optcg-organizador-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let rnd=Math.random;
const uid=()=>Math.random().toString(36).slice(2,9);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pct=x=>(x*100).toFixed(1);

/* ---------- Estado y sincronización entre ventanas ---------- */
let S=null;
const TABS=['insc','liga','gestion','pantalla'];
const ALIAS={ajustes:['liga'],torneo:['gestion','jornada'],cp:['gestion','jornada'],ronda:['gestion','jornada'],cuadro:['gestion','jornada'],tabla:['gestion','tabla'],inscritos:['liga'],torneos:['liga'],ligas:['liga'],mazos:['insc','mazos'],datos:['insc','datos']};
const ui={sub:{},tab:'gestion',round:null,league:null,screenHere:false,ask:null};
let bc=null; try{bc=new BroadcastChannel('optcg-organizador')}catch(e){}
/* Guardado: IndexedDB admite cientos de MB (localStorage solo ~5 MB). Si no está disponible, se usa localStorage. */
let IDB=null;
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('optcg-organizador',2);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('kv'))db.createObjectStore('kv');if(!db.objectStoreNames.contains('img'))db.createObjectStore('img')};r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}})}
function idbGet(){return new Promise(res=>{if(!IDB)return res(null);try{const q=IDB.transaction('kv').objectStore('kv').get(KEY);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(e){res(null)}})}
function idbPut(v,imgs){return new Promise(res=>{if(!IDB)return res(false);try{const tx=IDB.transaction(['kv','img'],'readwrite');tx.objectStore('kv').put(v,KEY);const st=tx.objectStore('img');(imgs||[]).forEach(([id,d])=>st.put(d,id));tx.oncomplete=()=>res(true);tx.onerror=tx.onabort=()=>res(false)}catch(e){res(false)}})}
function idbImgs(ids){return new Promise(res=>{if(!IDB||!ids.length)return res();try{const st=IDB.transaction('img').objectStore('img');let n=ids.length;ids.forEach(id=>{const q=st.get(id);q.onsuccess=()=>{if(q.result){IMG_DATA.set(id,q.result);IMG_ID.set(q.result,id)}if(!--n)res()};q.onerror=()=>{if(!--n)res()}})}catch(e){res()}})}
function idbGcImgs(used){if(!IDB)return;try{const st=IDB.transaction('img','readwrite').objectStore('img'),q=st.getAllKeys();q.onsuccess=()=>q.result.forEach(k=>{if(!used.has(k))st.delete(k)})}catch(e){}}
function loadLS(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
/* El estado se guarda sin imágenes: cada imagen va una sola vez al almacén 'img' y el estado solo lleva su referencia */
const IMG_ID=new Map(),IMG_DATA=new Map();
function lightJSON(){const pending=[];
  const j=JSON.stringify(S,(k,v)=>{if(typeof v==='string'&&v.length>300&&v.slice(0,5)==='data:'){let id=IMG_ID.get(v);if(!id){id='img:'+uid()+uid();IMG_ID.set(v,id);IMG_DATA.set(id,v);pending.push([id,v])}return id}return v});
  return{j,pending}}
function walkImgs(o,fn){if(Array.isArray(o)){for(let i=0;i<o.length;i++){const v=o[i];if(typeof v==='string'){if(v.slice(0,4)==='img:')o[i]=fn(v)}else if(v&&typeof v==='object')walkImgs(v,fn)}}
  else if(o&&typeof o==='object'){for(const k in o){const v=o[k];if(typeof v==='string'){if(v.slice(0,4)==='img:')o[k]=fn(v)}else if(v&&typeof v==='object')walkImgs(v,fn)}}}
async function hydrate(j){const x=typeof j==='string'?JSON.parse(j):j,miss=new Set();walkImgs(x,id=>{if(!IMG_DATA.has(id))miss.add(id);return id});
  if(miss.size)await idbImgs([...miss]);walkImgs(x,id=>IMG_DATA.get(id)||'');return x}
let saving=Promise.resolve(),warned=false;
function persist(){
  if(!IDB){try{localStorage.setItem(KEY,JSON.stringify(S));warned=false}catch(e){if(!warned){warned=true;toast('No se ha podido guardar: el navegador no tiene espacio. Revisa Inscripciones → Datos.')}}
    try{bc&&bc.postMessage('u')}catch(e){}return}
  const {j,pending}=lightJSON();
  try{bc&&bc.postMessage({j,imgs:pending})}catch(e){}
  saving=saving.then(async()=>{
    const ok=await idbPut(j,pending);
    if(ok){warned=false;try{localStorage.removeItem(KEY)}catch(e){}}
    else if(!warned){warned=true;toast('No se ha podido guardar: el navegador no tiene espacio. Revisa Inscripciones → Datos.')}
  });
}
async function load(){const v=await idbGet();if(v){try{return await hydrate(v)}catch(e){}}return loadLS()}
function commit(){persist();render();if(typeof fbEnsure==='function')fbEnsure()}
function fromStore(){load().then(x=>{if(x){S=x;scheduleRender()}})}
/* La otra ventana recibe el estado ligero y solo las imágenes nuevas: no relee la base de datos completa */
if(bc)bc.onmessage=ev=>{const m=ev.data;if(m&&m.j){(m.imgs||[]).forEach(([id,d])=>{IMG_DATA.set(id,d);IMG_ID.set(d,id)});hydrate(m.j).then(x=>{S=x;scheduleRender()}).catch(fromStore)}else fromStore()};
/* Agrupa repintados que llegan seguidos en un solo fotograma */
let rq=0;function scheduleRender(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;render()})}
window.addEventListener('storage',e=>{if(e.key===KEY)fromStore()});
window.addEventListener('pagehide',()=>{try{if(!IDB)localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}});
window.addEventListener('hashchange',()=>{if(/^#jugar/.test(location.hash)!==PLAYER)location.reload();else scheduleRender()});

/* ---------- Ayudantes de datos ---------- */
const T=()=>S.tournaments.find(t=>t.id===S.activeId)||null;
const pname=pid=>{const p=S.roster.find(r=>r.id===pid);return p?p.name:'¿?'};
const entry=(t,pid)=>t.players.find(p=>p.pid===pid)||{};
const leader=(t,pid)=>entry(t,pid).leader||'';
const dropped=(t,pid)=>!!entry(t,pid).drop;
const isScreen=()=>location.hash==='#pantalla'||ui.screenHere||ui._pv;
const winsNeeded=bo=>bo===3?2:1;
const isSw=t=>t.format==='swiss'||t.format==='gambling';
const isGb=t=>t.format==='gambling';
const isCp=t=>t.format==='cp';
const usesPool=t=>isGb(t)||isCp(t);
const fmtName=t=>t.format==='rr'?'Round robin':t.format==='gambling'?'Gambling battle royal':t.format==='cp'?'Counterpick (liga)':'Suizo';

function newTournament(o){return{id:uid(),name:o.name||'Torneo',date:o.date||'',leagueId:o.leagueId||'',format:o.format||'swiss',bo:+o.bo||1,boTop:+o.boTop||1,nRounds:+o.nRounds||0,topCut:+(o.topCut==null?4:o.topCut),roundMin:+o.roundMin||35,pickSec:+o.pickSec||20,bans:o.bans==null?1:+o.bans,extraTurns:+(o.extraTurns==null?3:o.extraTurns),extraMin:+(o.extraMin==null?5:o.extraMin),criterion:o.criterion||'Más cartas de Vida restantes',players:[],phase:'setup',rounds:[],top:[],seeds:[],timer:{start:null,acc:0,adj:0}}}
function rosterId(name){const n=name.trim();let p=S.roster.find(r=>r.name.toLowerCase()===n.toLowerCase());if(!p){p={id:uid(),name:n};S.roster.push(p)}return p.id}
function totalRounds(t){if(isCp(t))return t.rounds.length+cpProjected(t).length;if(t.format==='rr')return t.rounds.length||Math.max(1,t.players.length-(t.players.length%2?0:1));return t.nRounds||Math.max(1,Math.ceil(Math.log2(Math.max(2,t.players.length))))}
const allMatches=t=>t.rounds.flatMap(r=>r.matches);
function findMatch(t,id){for(const r of t.rounds)for(const m of r.matches)if(m.id===id)return{m,top:false};for(let i=0;i<t.top.length;i++)for(const m of t.top[i])if(m.id===id)return{m,top:true,ri:i};return null}
const loser=m=>m.w===m.a?m.b:m.a;
const mkMatch=(a,b,table)=>({id:uid(),a,b,w:null,ga:0,gb:0,xt:0,table});

/* ---------- Clasificación (puntos, OMW%, OOMW%, GW%) ---------- */
function standings(t){
  const st={};
  t.players.forEach(p=>st[p.pid]={pid:p.pid,w:0,l:0,mp:0,played:0,opp:[],gw:0,gp:0,byes:0});
  const g=winsNeeded(t.bo);
  for(const m of allMatches(t)){
    if(m.w==null)continue;
    if(m.b==null){const s=st[m.a];if(!s)continue;s.w++;s.mp+=3;s.played++;s.byes++;s.gw+=g;s.gp+=g;continue}
    const A=st[m.a],B=st[m.b];if(!A||!B)continue;
    A.played++;B.played++;A.opp.push(m.b);B.opp.push(m.a);
    if(m.w===m.a){A.w++;A.mp+=3;B.l++}else{B.w++;B.mp+=3;A.l++}
    A.gw+=m.ga;B.gw+=m.gb;A.gp+=m.ga+m.gb;B.gp+=m.ga+m.gb;
  }
  const L=Object.values(st);
  L.forEach(s=>s.mwp=s.played?Math.max(1/3,s.mp/(3*s.played)):0);
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  L.forEach(s=>s.omw=avg(s.opp.map(o=>st[o].mwp)));
  L.forEach(s=>s.oomw=avg(s.opp.map(o=>st[o].omw)));
  L.forEach(s=>s.gwp=s.gp?Math.max(1/3,s.gw/s.gp):0);
  if(isCp(t)||t.format==='rr'){
    /* Liga: a igualdad de puntos manda el enfrentamiento directo entre los empatados */
    const h2h=(grp)=>{const ids=new Set(grp.map(g=>g.pid)),pts={};grp.forEach(g=>pts[g.pid]=0);
      allMatches(t).forEach(m=>{if(m.w&&m.b!=null&&ids.has(m.a)&&ids.has(m.b))pts[m.w]+=3});return pts};
    const byMp={};L.forEach(x=>(byMp[x.mp]=byMp[x.mp]||[]).push(x));
    Object.values(byMp).forEach(g=>{const h=h2h(g);g.forEach(x=>x.h2h=h[x.pid])});
    L.sort((x,y)=>y.mp-x.mp||y.h2h-x.h2h||y.omw-x.omw||pname(x.pid).localeCompare(pname(y.pid)));
  }else L.sort((x,y)=>y.mp-x.mp||y.omw-x.omw||y.oomw-x.oomw||(t.bo===3?y.gwp-x.gwp:0)||pname(x.pid).localeCompare(pname(y.pid)));
  return L;
}

/* ---------- Emparejamientos ---------- */
function swissRound(t){
  const st=standings(t).filter(s=>!dropped(t,s.pid));
  const byMp={};st.forEach(s=>(byMp[s.mp]=byMp[s.mp]||[]).push(s.pid));
  let list=Object.keys(byMp).map(Number).sort((a,b)=>b-a).flatMap(k=>shuffle(byMp[k]));
  const hadBye=pid=>allMatches(t).some(m=>m.a===pid&&m.b==null);
  let bye=null;
  if(list.length%2){for(let i=list.length-1;i>=0;i--)if(!hadBye(list[i])){bye=list[i];break}if(bye==null)bye=list[list.length-1];list=list.filter(x=>x!==bye)}
  const played=new Set();allMatches(t).forEach(m=>{if(m.b!=null){played.add(m.a+'|'+m.b);played.add(m.b+'|'+m.a)}});
  let steps=0;
  function rec(arr){if(!arr.length)return[];if(++steps>40000)return null;const f=arr[0],rest=arr.slice(1);
    for(let i=0;i<rest.length;i++){if(played.has(f+'|'+rest[i]))continue;const r=rec(rest.filter((_,j)=>j!==i));if(r)return[[f,rest[i]]].concat(r)}return null}
  let pairs=rec(list);
  if(!pairs){pairs=[];for(let i=0;i<list.length;i+=2)pairs.push([list[i],list[i+1]])}
  const matches=pairs.map((p,i)=>mkMatch(p[0],p[1],i+1));
  if(bye!=null){const m=mkMatch(bye,null,'—');m.w=bye;m.ga=winsNeeded(t.bo);matches.push(m)}
  return{n:t.rounds.length+1,matches};
}
function rrSchedule(t){
  const a=shuffle(t.players.map(p=>p.pid));if(a.length%2)a.push(null);
  const n=a.length,rounds=[];let arr=a.slice();
  for(let r=0;r<n-1;r++){
    const ms=[];let tb=1;
    for(let i=0;i<n/2;i++){const x=arr[i],y=arr[n-1-i];
      if(x==null||y==null){const p=x==null?y:x;const m=mkMatch(p,null,'—');m.w=p;m.ga=winsNeeded(t.bo);ms.push(m)}
      else ms.push(mkMatch(x,y,tb++))}
    ms.sort((p,q)=>(p.b==null)-(q.b==null));
    rounds.push({n:r+1,matches:ms});
    arr=[arr[0],arr[n-1]].concat(arr.slice(1,n-1));
  }
  return rounds;
}
/* ---------- Counterpick: calendario automático y draft ---------- */
const pairKey=(a,b)=>a<b?a+'|'+b:b+'|'+a;
function cpPending(t,extra){
  const act=t.players.filter(p=>!p.drop).map(p=>p.pid),played=new Set();
  allMatches(t).forEach(m=>{if(m.b!=null)played.add(pairKey(m.a,m.b))});
  (extra||[]).forEach(k=>played.add(k));
  const out=[];for(let i=0;i<act.length;i++)for(let j=i+1;j<act.length;j++){const k=pairKey(act[i],act[j]);if(!played.has(k))out.push([act[i],act[j]])}
  return out;
}
/* Busca el mayor número de mesas posibles con los enfrentamientos pendientes */
function cpMatching(pairs,tries){
  if(!pairs.length)return[];
  const deg={};pairs.forEach(([a,b])=>{deg[a]=(deg[a]||0)+1;deg[b]=(deg[b]||0)+1});
  let best=[];
  for(let k=0;k<(tries||120);k++){

function applyTimer(el,g){el.classList.toggle('warn',g.st==='main'&&g.ms<=300000);el.classList.toggle('extra',g.st==='extra');el.classList.toggle('over',g.st==='end')}
setInterval(()=>{
  if(!S)return;const t=T();if(!t)return;
  const g=tStage(t),k=t.id+roundKey(t);
  if(t.timer.start){
    if(g.st==='extra'&&!beeped.has(k+'L')){beeped.add(k+'L');beep('limit')}
    if(g.st==='end'&&!beeped.has(k+'E')){beeped.add(k+'E');beeped.add(k+'L');beep('end')}
  }
  const els=document.querySelectorAll('[data-timer]');
  const txt=fmt(g.ms);
  els.forEach(el=>{const d=el.querySelector('.tm-digits');if(d.dataset.v!==txt){d.dataset.v=txt;d.innerHTML=digits(g.ms)}applyTimer(el,g)});
  if(els.length&&g.st!==lastOver)scheduleRender();
},250);

/* Draft: cuenta atrás del turno y elección automática al agotarse */
setInterval(()=>{
  if(window.__lockUntil&&Date.now()>=window.__lockUntil){window.__lockUntil=0;scheduleRender()}
  if(!S)return;const t=T();if(!t||!isCp(t)||t.phase!=='rounds')return;
  const ri=t.rounds.length-1,r=t.rounds[ri];if(!draftOn(t,r)||!r.draft.ts)return;
  const left=r.draft.ts+t.pickSec*1000-Date.now();
  document.querySelectorAll('[data-pick] .dr-s').forEach(e=>{const v=String(Math.min(t.pickSec,Math.max(0,Math.ceil(left/1000))));if(e.textContent!==v)e.textContent=v});
  document.querySelectorAll('[data-pick]').forEach(e=>e.classList.toggle('hurry',left<=5000));
  if(left<=0&&location.hash!=='#pantalla'&&banOn(r.draft)){cpBan(t,ri,null);commit();return}
  if(left<=0&&location.hash!=='#pantalla'){const av=cpAvailable(t,ri,r.draft.order[r.draft.i]);if(av.length){cpPick(t,ri,av[Math.floor(Math.random()*av.length)].id);igniteSound();commit()}}
},200);
/* Ruleta: las cartas de las mesas en sorteo van cambiando hasta que cada una se detiene */
setInterval(()=>{
  const els=document.querySelectorAll('.fo-card.spin');if(!els.length)return;
  const t=T();const pool=t?poolOf(t):[];if(!pool.length)return;
  const now=Date.now();let landed=false;
  els.forEach(el=>{if(now>=+el.dataset.land){landed=true;return}
    const d=pool[Math.floor(Math.random()*pool.length)],c=el.querySelector('.cdL');
    if(c)c.outerHTML=d.card?`<img class="cdL" src="${imgSrc(d.card)}" alt="">`:`<span class="cdL ph">${esc(d.name)}</span>`});
  if(landed){render();try{if(actx)tone(1046,actx.currentTime,.12,.25)}catch(e){}}
},100);

/* Las imágenes se guardan como data URL; para pintar se convierten una vez en URL blob cortas y el navegador reutiliza la imagen ya decodificada */
const BLOBS=new Map();
function imgSrc(u){if(!u||u.slice(0,5)!=='data:')return u||'';let b=BLOBS.get(u);if(b)return b;
  try{const i=u.indexOf(','),mime=u.slice(5,u.indexOf(';')),bin=atob(u.slice(i+1)),arr=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)arr[k]=bin.charCodeAt(k);b=URL.createObjectURL(new Blob([arr],{type:mime}))}catch(e){b=u}
  BLOBS.set(u,b);return b}

/* Reduce la imagen elegida (recorte centrado) para que quepa en el navegador */
function fileToImg(file,w,h,cb){
  if(!file||!/^image\//.test(file.type)){toast('Elige un archivo de imagen');cb('');return}
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
    x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';const s=Math.max(w/im.width,h/im.height),dw=im.width*s,dh=im.height*s;x.fillStyle='#141715';x.fillRect(0,0,w,h);x.drawImage(im,(w-dw)/2,(h-dh)/2,dw,dh);cb(c.toDataURL('image/jpeg',.88))};
    im.onerror=()=>{toast('No se pudo leer la imagen');cb('')};im.src=r.result};
  r.readAsDataURL(file);
}
const PHOTO=[320,320],CARD=[630,882];
/* Nombre del líder a partir del nombre de archivo */
function leaderFromFile(fn){
  let b=fn.replace(/\.[a-z0-9]+$/i,'').replace(/[_]+/g,' ').replace(/\s+/g,' ').trim();
  const codeRe=/\b(OP|ST|EB|PRB|P)[\s-]?(\d{1,3})(?:[\s-]?\d{3})?\b/i;
  const mt=b.match(codeRe);let code='';
  if(mt){const pre=mt[1].toUpperCase(),num=mt[2];code=pre==='P'?'P-'+num.padStart(3,'0'):pre+num.padStart(2,'0');b=(b.slice(0,mt.index)+' '+b.slice(mt.index+mt[0].length))}
  b=b.replace(/[()\[\]]/g,' ').replace(/-+/g,' ').replace(/\s+/g,' ').trim();
  if(b&&b===b.toLowerCase())b=b.replace(/(^|\s)(\p{L})/gu,(x,s1,c)=>s1+c.toUpperCase());
  return(b||'Líder')+(code?' ('+code+')':'');
}
function importCardFiles(files){
  files=[...files].filter(f=>/^image\//.test(f.type));if(!files.length){toast('No hay imágenes en la selección');return}
  S.decks=S.decks||[];let i=0,added=0,updated=0;const pr=$('#bulk-prog');
  const next=()=>{
    if(i>=files.length){commit();toast(`${added} líderes añadidos${updated?' · '+updated+' actualizados':''}`);return}
    const f=files[i++],name=leaderFromFile(f.name);
    if(pr){pr.hidden=false;pr.textContent=`Procesando ${i} de ${files.length}: ${name}`}
    fileToImg(f,CARD[0],CARD[1],u=>{if(u){const ex=S.decks.find(d=>d.name.toLowerCase()===name.toLowerCase());
      if(ex){ex.card=u;updated++}else{const d={id:uid(),name,card:u};S.decks.push(d);added++;
        const t=T();if(t&&usesPool(t)&&t.phase==='setup'&&t.pool)t.pool.push(d.id)}}next()});
  };
  next();
}

/* Mesa como enfrentamiento: dos cartas de líder cara a cara */
function faceoff(t,m,o){

  const bo=o.bo||t.bo,gb0=usesPool(t)&&m.b!=null,ready=!gb0||(m.rv&&Date.now()>=landAt(m)),act=o.interactive&&ready;
  const nameOf=pid=>{const d=deckState(t,m,pid);return d?(d.name||''):leader(t,pid)};
  const wl=m.w?(nameOf(m.w)||pname(m.w)):'';
  const side=(pid,isA)=>{
    if(pid==null)return`<div class="fo-p tbd"><span class="fo-card"><span class="cdL ph">${o.bye?'Bye':'Por decidir'}</span></span><div class="fo-n"><span class="nm">—</span></div></div>`;
    const st=m.w==null?'':m.w===pid?'w':'l';
    const dk=deckState(t,m,pid);
    const ld=dk?(dk.hidden?(isCp(t)?'Por elegir':'Por sortear'):dk.spin?'Sorteando…':dk.name):leader(t,pid);
    const art=leaderArt(t,pid,st,null,dk||undefined);

    let gb='';

      return act?`<button class="${on?'on':''}" data-act="rep" data-m="${m.id}" data-w="${pid}" data-ga="${ga}" data-gb="${gbb}" aria-label="${esc(pname(pid))} gana ${x}-${y}">${x}-${y}</button>`:on?`<button class="on" disabled>${x}-${y}</button>`:''}).join('')}</div>`}
    const sd=o.seeded&&t.seeds.indexOf(pid)>=0?`<span class="seed">#${t.seeds.indexOf(pid)+1}</span>`:'';
    const g=bo===3&&m.w?`<span class="fo-g">${isA?m.ga:m.gb}</span>`:'';
    return`<div class="fo-p ${st}">${card}<div class="fo-n"><span class="nm">${sd}${esc(pname(pid))}${g}${dropped(t,pid)?' <span class="chip">retirado</span>':''}</span>${ld?`<span class="ld">${esc(ld)}</span>`:''}</div>${gb}</div>`;
  };
  const score=m.w&&bo===3?` ${Math.max(m.ga,m.gb)}-${Math.min(m.ga,m.gb)}`:'';
  const head=o.compact?(m.w?`<span class="fo-s w">Gana ${esc(wl)}${score}</span>`:m.a!=null&&m.b!=null?`<span class="fo-s">${o.live?'En juego':'Mesa '+esc(m.table)}</span>`:'<span class="fo-s">Por jugar</span>')
    :`<span class="fo-t">Mesa<b>${esc(m.table)}</b></span><span class="fo-s ${m.w?'w':''}">${m.w?'Gana '+esc(wl)+score:gb0&&!m.rv?(isCp(t)?'Draft':'Por sortear'):'En juego'}</span>`;
  return`<div class="fo ${o.compact?'compact '+(o.compact==='xs'?'xs':''):''} ${m.w?'done':''} ${o.live?'live':''} ${FRESH.has(m.id)?'fresh':''}">
    <div class="fo-h">${head}</div>
    <div class="fo-b">${side(m.a,true)}<div class="fo-vs">VS</div>${side(m.b,false)}</div>${o.xt||''}</div>`;
}

function cpStep(t){
  if(t.phase==='setup')return 0;if(t.phase==='done')return 5;
  const r=t.rounds[t.rounds.length-1];
  if(draftOn(t,r))return r.draft.ts?2:1;
  return r.matches.every(m=>m.w)?4:3;
}
function cpJornada(){
  const cps=S.tournaments.filter(isCp);
  if(!cps.length)return`<div class="sec"><div class="card cp-intro"><h2>Counterpick</h2>${cpRules()}
    <button class="btn" data-act="newCp">Crear liga Counterpick</button></div></div>`;
  const t=T();
  if(!t||!isCp(t))return`<div class="sec"><h2>Elige una liga Counterpick</h2><div class="tlist">${cps.map(x=>`<button class="tl" data-act="openCp" data-v="${x.id}"><span class="nm">${esc(x.name)}</span><span class="ld">${x.players.length} jugadores · ${x.rounds.length} jornadas</span>${phaseChip(x)}</button>`).join('')}</div></div>`;
  const st=cpStep(t),r=t.rounds[t.rounds.length-1],J=t.rounds.length;
  const hasBan=t.bans!==0;
  const steps=hasBan?['Emparejar','Baneos','Draft','Jugar','Cerrar jornada']:['Emparejar','Draft','Jugar','Cerrar jornada'];
  const inBan=r&&r.draft&&banOn(r.draft);
  const off=hasBan?1:0;
  const stepIx=st===0?-1:st===1?(hasBan?1:1):st===2?(inBan?1:1+off):st===3?2+off:st===4?3+off:9;
  const bar=`<ol class="steps">${steps.map((s,i)=>`<li class="${i<stepIx||st===5?'done':i===stepIx?'now':''}"><span>${i+1}</span>${s}</li>`).join('')}</ol>`;
  let panel='';
  if(st===0){
    const n=t.players.filter(p=>!p.drop).length,need=cpNeeded(t),have=poolOf(t).length;
    panel=`<div class="card"><h2>Antes de empezar</h2>
      <ul class="check"><li class="${n>=2?'ok':''}">${n} jugadores inscritos <button class="btn ghost sm" data-act="tab" data-v="liga">Editar</button></li>
      <li class="${have>=n?'ok':''}">${have} mazos en el pool · mínimo ${n}${have<need?` (con ${need} nadie repite)`:''} <button class="btn ghost sm" data-act="tab" data-v="liga">Editar</button></li>
      ${t.bans!==0?`<li class="${have>=2*n?'ok':''}">Baneos activos · con ${2*n} mazos o más todos pueden banear${have<2*n?`; con ${have} solo banearán ${Math.max(0,have-n)}`:''}</li>`:''}
      <li class="ok">${t.pickSec} segundos por turno</li></ul>
      <button class="btn block" data-act="startT" ${n<2||have<n?'disabled':''}>Empezar liga y emparejar la jornada 1</button></div>`;
  }else if(st===1){
    panel=`<div class="card"><h2>Jornada ${J} · emparejamientos</h2>
      <div class="pairs">${r.matches.map(m=>`<div class="pr"><span class="pc">${avatar(m.a)}<span>${esc(pname(m.a))}</span></span><span class="vs">VS</span><span class="pc">${avatar(m.b)}<span>${esc(pname(m.b))}</span></span></div>`).join('')}</div>
      ${r.rest&&r.rest.length?`<p class="muted small" style="margin:0">Descansa: ${r.rest.map(pname).map(esc).join(', ')}</p>`:''}
      ${r.draft.banOrder?`<p class="muted small" style="margin:0"><b>Baneos</b> en orden aleatorio: ${r.draft.banOrder.map(pname).map(esc).join(' → ')}. Cada uno veta un líder para esta jornada.${poolOf(t).length-r.draft.order.length<r.draft.banOrder.length?` Con ${poolOf(t).length} mazos solo banearán los ${Math.max(0,poolOf(t).length-r.draft.order.length)} primeros, para que a todos les quede un mazo.`:''}</p>`:''}
      <p class="muted small" style="margin:0"><b>Elección</b>: ${J===1?'orden aleatorio (primera jornada)':'de mejor a peor clasificado'}. Cada turno tiene ${t.pickSec} s.</p>
      <button class="btn block" data-act="draftGo">${r.draft.banOrder?'Empezar baneos':'Empezar draft'}</button></div>`;
  }else if(st===2){
    panel=draftBoard(t,r,false);
  }else if(st===3){
    const over=tRemain(t)<=0;
    panel=`${timerBlock(t,'Jornada '+J)}<div class="row between"><h2>Partidas</h2><span class="progress">${r.matches.filter(m=>m.w).length}/${r.matches.length} reportadas</span></div>
      <div class="matches">${r.matches.map(m=>matchCard(t,m,{over})).join('')}</div>
      <p class="muted small" style="margin:0">Toca la carta del ganador de cada mesa.</p>`;
  }else if(st===4){
    const pend=cpPending(t).length;
    panel=`<div class="card"><h2>Jornada ${J} terminada</h2>
      <p style="margin:0">${pend?`Quedan ${pend} enfrentamientos · unas ${cpProjected(t).length} jornadas más.`:'Ya se han jugado todos los enfrentamientos.'}</p>
      <div class="row">${pend?`<button class="btn" data-act="genR">Emparejar jornada ${J+1}</button>`:'<button class="btn" data-act="closeT">Cerrar liga</button>'}<button class="btn ghost" data-act="sub" data-v="gestion:tabla">Ver clasificación</button></div></div>`;
  }else{
    panel=`<div class="card"><h2>Liga cerrada</h2>${podium(t,3)}<button class="btn ghost" data-act="reopenT" style="justify-self:start">Reabrir</button></div>`;
  }
  return`<div class="sec">${st>0&&st<5?`<p class="muted small" style="margin:0">Jornada ${J} de ~${totalRounds(t)}</p>`:''}${bar}${panel}</div>`;
}

/* Ajusta el tamaño de las mesas para que quepan todas en pantalla sin desplazarse */
function fitTiles(){
  document.querySelectorAll('.scr .tiles.fit').forEach(box=>{
    if(!box.children.length||!box.clientWidth)return;
    const scr=box.closest('.scr'),pv=box.closest('.pv');
    const sc=pv?pv.getBoundingClientRect().width/1600:1;
    const top=pv?(box.getBoundingClientRect().top-pv.getBoundingClientRect().top)/sc:box.getBoundingClientRect().top;
    const n=box.children.length,gap=14,W=box.clientWidth,H=(pv?900:window.innerHeight)-top-28;
    let best={cw:0,c:1};
    for(let c=1;c<=n;c++){const rows=Math.ceil(n/c),tw=(W-gap*(c-1))/c,th=(H-gap*(rows-1))/rows;const cw=Math.min(tw/2.7,th/2.6);if(cw>best.cw)best={cw,c}}
    let cw=Math.max(36,Math.min(best.cw,240));
    box.style.gridTemplateColumns=`repeat(${best.c},minmax(0,1fr))`;
    const apply=()=>{box.style.setProperty('--cw',cw+'px');box.style.fontSize=Math.max(9,cw*.13)+'px'};
    apply();for(let i=0;i<24&&box.offsetHeight>H&&cw>36;i++){cw*=.94;apply()}
  });
}
function fitStandings(){
  document.querySelectorAll('.scr .cpt-fit').forEach(box=>{
    if(!box.clientWidth)return;const pv=box.closest('.pv'),scr=box.closest('.scr');
    const sc=pv?pv.getBoundingClientRect().width/1600:1;
    const limit=(pv?900:window.innerHeight)-parseFloat(getComputedStyle(scr).paddingBottom||0)-4;
    const bottom=()=>pv?(box.getBoundingClientRect().bottom-pv.getBoundingClientRect().top)/sc:box.getBoundingClientRect().bottom;
    /* la mayor altura de fila con la que la tabla entera cabe en pantalla */
    let lo=20,hi=110;
    for(let i=0;i<9;i++){const mid=(lo+hi)/2;box.style.setProperty('--rh',mid+'px');if(bottom()<=limit)lo=mid;else hi=mid}
    box.style.setProperty('--rh',lo+'px');
  });
}

function blank(){return{v:1,roster:[],leagues:[],tournaments:[],activeId:null,screen:'auto'}}
function seed(){
  let sd=20261030;rnd=()=>{sd|=0;sd=sd+0x6D2B79F5|0;let x=Math.imul(sd^sd>>>15,1|sd);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296};
  S=blank();
  ['Marta R.','Álex P.','Iker S.','Nuria V.','Pau G.','Lucía M.','Hugo T.','Carla B.'].forEach(rosterId);
  S.decks=['Nami (OP03)','Enel (OP05)','Trafalgar Law (OP01)','Boa Hancock (OP07)','Shanks (OP09)','Kaido (OP04)','Yamato (OP06)','Rob Lucci (OP07)','Crocodile (OP01)','Monkey.D.Luffy (OP05)','Katakuri (OP03)','Sabo (OP04)','Kid (OP01)','Uta (OP02)'].map(n=>({id:uid(),name:n,card:''}));
  const t=newTournament({name:'Liga Counterpick (ejemplo)',date:'2026-10-30',format:'cp',topCut:0,bans:1});
  t.pool=S.decks.map(d=>d.id);S.roster.forEach(r=>t.players.push({pid:r.id,leader:'',drop:false,card:''}));
  S.tournaments.push(t);S.activeId=t.id;
  t.rounds=[cpRound(t)];t.phase='rounds';
  const playJ=ri=>{const r=t.rounds[ri],d=r.draft;
    while(banOn(d)){const av=banAvailable(t,ri);cpBan(t,ri,av.length?av[Math.floor(rnd()*av.length)].id:null)}
    while(d.i<d.order.length){const av=cpAvailable(t,ri,d.order[d.i]);cpPick(t,ri,av[Math.floor(rnd()*av.length)].id)}
    r.matches.forEach(m=>{m.w=rnd()<.5?m.a:m.b;m.ga=m.w===m.a?1:0;m.gb=m.w===m.b?1:0;m.rv=1})};
  playJ(0);t.rounds.push(cpRound(t));playJ(1);t.rounds.push(cpRound(t));
  t.rounds.forEach(r=>{if(r.draft)r.draft.ts=null});
  resetTimer(t);rnd=Math.random;
  return S;
}

  else if(P.phase==='done')turn=`<div class="pl-turn"><div><span class="pl-k">Liga cerrada</span><b>Gracias por jugar</b></div></div>`;
  else turn=`<div class="pl-turn"><div><span class="pl-k">Jornada ${P.J}</span><b>Esperando al organizador</b></div></div>`;
  const vs=m?`<div class="pl-vs"><div class="pl-side">${myPick?plCard(myPick,'pl-mc'):'<span class="fo-card pl-mc empty"><span class="cdL ph">Tu líder</span></span>'}<b>Tú</b></div><i>VS</i>
      <div class="pl-side">${oppPick?plCard(oppPick,'pl-mc'):'<span class="fo-card pl-mc empty"><span class="cdL ph">?</span></span>'}<b>${esc(plName(opp))}</b></div></div>
      <p class="muted small" style="margin:0;text-align:center">Mesa ${esc(m.t)}${m.w?` · ${m.w===me?'Has ganado':'Has perdido'}`:''}</p>`:(r&&r.rest&&r.rest.includes(me)?'<p class="muted" style="text-align:center">Esta jornada descansas.</p>':'');
  /* mazos */
  let grid='';
  if(d&&d.on){
    const mine=d.cur===me&&Date.now()>=d.ts-FB.offset&&!PL.sent;
    const banned=new Set(Object.values(d.b||{}).filter(Boolean)),picked=Object.entries(d.p||{}),pk={};picked.forEach(([p,id])=>pk[id]=p);
    const av=new Set(d.av||[]),used=new Set(P.used[me]||[]);
    grid=`<div class="pl-h"><h3>${d.kind==='ban'?'Líderes':'Mazos'}</h3>${mine?`<span class="muted small">${d.kind==='ban'?'Toca el que quieres banear':'Toca el que quieres jugar'}</span>`:''}</div>
      <div class="pl-grid">${P.pool.map(x=>{const st=banned.has(x.id)?'bann':pk[x.id]?'taken':mine&&av.has(x.id)?'free':used.has(x.id)?'used':'idle';
        const tag=st==='bann'?'Baneado':pk[x.id]?esc(plName(pk[x.id])):st==='used'?'Ya lo jugaste':'';
        return`<div class="pl-dk ${st}" ${st==='free'?`role="button" tabindex="0" data-act="plPick" data-v="${x.id}"`:''}>${plCard(x.id,st==='bann'?'banned':'')}<span class="dk-n">${esc(x.n)}</span>${tag?`<span class="dk-tag">${tag}</span>`:''}</div>`}).join('')}</div>
      ${mine&&d.kind==='ban'?'<button class="btn ghost block" data-act="plNoBan">No banear</button>':''}
      ${PL.sent?'<p class="pl-sent">Enviado. Esperando al organizador…</p>':''}`;
  }
  const tabla=`<div class="pl-h"><h3>Clasificación</h3></div><div class="twrap"><table class="cpt pl-tb"><thead><tr><th>#</th><th>Jugador</th><th>V</th><th>D</th><th>Pts</th></tr></thead><tbody>
    ${P.st.map((x,i)=>`<tr class="${x.id===me?'me':''}"><td class="pos">${i+1}</td><td>${esc(plName(x.id))}</td><td>${x.w}</td><td>${x.l}</td><td class="pts">${x.pts}</td></tr>`).join('')}</tbody></table></div>`;
  return`<div class="pl-who"><span>Juegas como <b>${esc(plName(me))}</b></span><button class="btn ghost sm" data-act="plLeave">No soy yo</button></div>
    ${turn}${vs}${grid}${d&&d.on?'':tabla}`;
}
function plConfirm(id){
  const d=PL.pub.r.d,dk=plDeck(id),ban=d.kind==='ban';
  ui.ask={msg:(ban?'¿Banear ':'¿Elegir ')+dk.n+'?',ok:ban?'Banear':'Elegir',danger:ban,fn:()=>plSend(ban?'ban':'pick',id)};renderModal();
}
function plSend(type,deck){
  if(!FB.db||!PL.me)return;PL.sent={type,deck};scheduleRender();
  lref('actions').push({uid:FB.uid,pid:PL.me,type,deck:deck||'',at:firebase.database.ServerValue.TIMESTAMP}).catch(()=>{PL.sent=null;toast('No se pudo enviar: revisa tu conexión');scheduleRender()});
  setTimeout(()=>{if(PL.sent){PL.sent=null;scheduleRender()}},8000);
}

/* Si el estado de la liga en línea cambia, se publica para los móviles */
function fbEnsure(){const t=onlineT();
  if(t&&FB.db&&FB.code!==t.online.code){goOnline(t).catch(()=>{});return}
  if(!t&&FB.code&&!PLAYER){fbDetach();FB.code=null;return}
  if(t&&FB.db){fbPush();fbPushImgs(t)}}
(async()=>{
  if(PLAYER){document.addEventListener('pointerdown',unlockAudio,{once:true});playerBoot();return}
  IDB=await idbOpen();
  if(IDB&&navigator.storage&&navigator.storage.persist){try{navigator.storage.persist()}catch(e){}}
  const raw=IDB?await idbGet():null,fromLS=!raw&&loadLS();
  S=(await load())||seed();
  if(!S.decks)S.decks=[];
  if(!S.screen)S.screen='auto';
  if(!S.fxV){if(S.pickFx==='gl'||S.pickFx==='flames')S.pickFx='bolt';S.fxV=2}
  /* datos antiguos (imágenes dentro del estado) o recién migrados: se guardan ya separados */
  if(IDB&&(fromLS||!raw||raw.indexOf('data:image')>=0))persist();
  /* limpieza de imágenes que ya nadie usa, cuando el guardado ha terminado */
  if(IDB)saving.then(()=>{const used=new Set();JSON.stringify(S,(k,v)=>{if(typeof v==='string'&&v.slice(0,5)==='data:'){const id=IMG_ID.get(v);if(id)used.add(id)}return v});setTimeout(()=>idbGcImgs(used),2000)});
  render();
  {const t=T();if(t&&isCp(t)&&t.online&&t.online.on&&fbCfg())goOnline(t).catch(()=>{})}
})();
})();
</script>
</body></html>
